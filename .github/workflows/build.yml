name: Build HOMEBD

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build HOMEBD
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract HOMEBD project
        shell: bash
        run: |
          echo "=== BEFORE EXTRACTION ==="
          ls -la

          ZIP="HOMEBD_V1.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP not found"
            exit 1
          fi

          mkdir -p /tmp/homebd

          unzip -q -o "$ZIP" -d /tmp/homebd

          echo "=== EXTRACTED ==="
          find /tmp/homebd -maxdepth 4 -type f | sort

          SETTINGS=$(find /tmp/homebd -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle(.kts) not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Gradle project:"
          echo "$PROJECT_DIR"

          cp -R "$PROJECT_DIR"/. .

      - name: Verify Gradle project
        run: |
          echo "=== PROJECT ROOT ==="
          pwd
          ls -la

          test -f settings.gradle.kts || \
          test -f settings.gradle

          test -f build.gradle.kts || \
          test -f build.gradle

      - name: Install Gradle
        run: |
          wget -q \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip \
            -O /tmp/gradle.zip

          sudo unzip -q /tmp/gradle.zip -d /opt

          echo "/opt/gradle-8.9/bin" >> "$GITHUB_PATH"

          /opt/gradle-8.9/bin/gradle --version

      - name: Create Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.9
          chmod +x ./gradlew

      - name: Build HOMEBD
        run: |
          ./gradlew clean assembleDebug --stacktrace

      - name: Find APK
        run: |
          echo "=== GENERATED APK ==="
          find . -type f -name "*.apk" -print

      - name: Upload HOMEBD APK
        uses: actions/upload-artifact@v4
        with:
          name: HOMEBD-debug
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
