name: Build HOMEBD

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build HOMEBD
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Show project
        run: |
          echo "=== HOMEBD ==="
          pwd
          ls -la
          echo "--- Gradle ---"
          find . -maxdepth 3 -type f \
            \( -name "*.gradle" \
            -o -name "*.gradle.kts" \
            -o -name "gradle-wrapper.properties" \) \
            -print

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip \
            -O /tmp/gradle.zip

          sudo unzip -q /tmp/gradle.zip -d /opt

          echo "/opt/gradle-8.9/bin" >> $GITHUB_PATH

          /opt/gradle-8.9/bin/gradle --version

      - name: Create Gradle Wrapper
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 8.9
          fi

          chmod +x ./gradlew

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_SDK_ROOT"

      - name: Build HOMEBD
        run: |
          ./gradlew clean assembleDebug --stacktrace

      - name: Find APK
        run: |
          echo "=== APK ==="
          find . -type f -name "*.apk" -print

      - name: Upload HOMEBD APK
        uses: actions/upload-artifact@v4
        with:
          name: HOMEBD-debug
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
