name: Build HOMEBD APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build HOMEBD V2
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "ANDROID SDK"
          echo "========================================"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          test -d "$ANDROID_HOME"

          echo "✓ Android SDK encontrado"

      - name: Verify HOMEBD project
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "HOMEBD PROJECT"
          echo "========================================"

          pwd

          echo ""
          echo "Ficheiros:"
          find . -maxdepth 6 -type f | sort

          echo ""
          echo "Verificação:"

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

          echo "✓ settings.gradle.kts"
          echo "✓ build.gradle.kts"
          echo "✓ app/build.gradle.kts"
          echo "✓ AndroidManifest.xml"

          echo ""
          echo "✓ HOMEBD VALIDADO"

      - name: Show Gradle version
        shell: bash
        run: |
          gradle --version

      - name: Build HOMEBD Debug APK
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "BUILD HOMEBD V2"
          echo "========================================"

          gradle \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Find APK
        shell: bash
        run: |
          echo "========================================"
          echo "APK"
          echo "========================================"

          find . \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HOMEBD-V2-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
