name: Build HOMEBD APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build HOMEBD V3
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "ANDROID SDK"
          echo "========================================"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          test -d "$ANDROID_HOME"

          echo "✓ Android SDK encontrado"

      - name: Find HOMEBD V3 ZIP
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "PROCURAR HOMEBD V3"
          echo "========================================"

          find . -maxdepth 2 -type f -name "*.zip" -print

          ZIP=$(find . -maxdepth 2 -type f \
            -name "HOMEBD_V3_VERTICAL_SCROLL_FIXED.zip" \
            | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "✕ HOMEBD_V3_VERTICAL_SCROLL_FIXED.zip não encontrado"
            exit 1
          fi

          echo "✓ ZIP encontrado:"
          echo "$ZIP"

          echo "HOMEBD_ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract HOMEBD V3
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "EXTRAIR HOMEBD V3"
          echo "========================================"

          rm -rf homebd_project
          mkdir -p homebd_project

          unzip -o "$HOMEBD_ZIP" -d homebd_project

          echo ""
          echo "Projeto extraído:"
          find homebd_project -maxdepth 6 -type f | sort

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "LOCALIZAR PROJETO ANDROID"
          echo "========================================"

          SETTINGS=$(find homebd_project \
            -type f \
            -name "settings.gradle.kts" \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "✕ settings.gradle.kts não encontrado"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "✓ Projeto encontrado:"
          echo "$PROJECT_DIR"

          echo "HOMEBD_PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify Android project
        shell: bash
        run: |
          set -e

          cd "$HOMEBD_PROJECT_DIR"

          echo "========================================"
          echo "VALIDAR HOMEBD V3"
          echo "========================================"

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

          echo "✓ settings.gradle.kts"
          echo "✓ build.gradle.kts"
          echo "✓ app/build.gradle.kts"
          echo "✓ AndroidManifest.xml"

          echo ""
          echo "✓ PROJETO HOMEBD V3 VALIDADO"

      - name: Show Gradle
        shell: bash
        run: |
          gradle --version

      - name: Build HOMEBD V3 Debug APK
        shell: bash
        run: |
          set -e

          cd "$HOMEBD_PROJECT_DIR"

          echo "========================================"
          echo "BUILD HOMEBD V3"
          echo "========================================"

          gradle \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Find APK
        shell: bash
        run: |
          echo "========================================"
          echo "APK GERADO"
          echo "========================================"

          find "$HOMEBD_PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload HOMEBD V3 APK
        uses: actions/upload-artifact@v4
        with:
          name: HOMEBD-V3-debug-apk
          path: homebd_project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
