name: Build HOMEBD APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build HOMEBD
    runs-on: ubuntu-latest

    steps:

      # 1 — Código do repositório
      - name: Checkout
        uses: actions/checkout@v4

      # 2 — Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3 — Encontrar e extrair o ZIP HOMEBD
      - name: Find and extract HOMEBD ZIP
        shell: bash
        run: |
          set -e

          echo "=== PROCURAR ZIP HOMEBD ==="

          ZIP=$(find . -maxdepth 2 -type f -iname 'HOMEBD_*.zip' | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERRO: nenhum ZIP HOMEBD encontrado."
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "ZIP encontrado:"
          echo "$ZIP"

          mkdir -p build_source

          unzip -q "$ZIP" -d build_source

          echo "=== ZIP EXTRAÍDO ==="
          find build_source -maxdepth 4 -type f | sort

      # 4 — Encontrar automaticamente o projeto Android
      - name: Find Android project
        shell: bash
        run: |
          set -e

          PROJECT=$(find build_source \
            -type f \( \
              -name 'settings.gradle.kts' \
              -o -name 'settings.gradle' \
            \) \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT" ]; then
            echo "ERRO: projeto Android não encontrado."
            find build_source -maxdepth 5 -type f | sort
            exit 1
          fi

          echo "Projeto encontrado:"
          echo "$PROJECT"

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

      # 5 — Instalar Gradle 8.13
      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      # 6 — Verificar ferramentas
      - name: Check build tools
        shell: bash
        run: |
          echo "=== JAVA ==="
          java -version

          echo "=== GRADLE ==="
          gradle --version

      # 7 — Configurar Android SDK
      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"

          echo "Android SDK:"
          echo "$SDK"

          SDKMANAGER=$(find "$SDK/cmdline-tools" \
            -type f \
            -name sdkmanager \
            2>/dev/null | head -n 1 || true)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERRO: sdkmanager não encontrado."
            exit 1
          fi

          echo "sdkmanager:"
          echo "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 8 — Mostrar estrutura do projeto
      - name: Check Android project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=== DIRETÓRIO DO PROJETO ==="
          pwd

          echo "=== FICHEIROS ==="
          find . -maxdepth 3 -type f | sort

      # 9 — Compilar HOMEBD
      - name: Build HOMEBD
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=== PROJETO HOMEBD ==="
          ls -la

          if [ -f gradlew ]; then
            echo "Gradle Wrapper encontrado."

            chmod +x gradlew

            ./gradlew assembleDebug \
              --stacktrace \
              --no-daemon
          else
            echo "Gradle Wrapper não encontrado."
            echo "Usando Gradle 8.13 instalado pelo workflow."

            gradle assembleDebug \
              --stacktrace \
              --no-daemon
          fi

      # 10 — Procurar APK gerado
      - name: Find generated APK
        shell: bash
        run: |
          set -e

          echo "=== APK GERADO ==="

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

      # 11 — Publicar APK
      - name: Upload HOMEBD APK
        uses: actions/upload-artifact@v4
        with:
          name: HOMEBD-APK
          path: |
            **/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # 12 — Guardar relatórios se houver erro
      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HOMEBD-build-reports
          path: |
            **/app/build/reports/**
            **/app/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 14
