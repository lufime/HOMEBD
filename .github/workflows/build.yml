name: Build HOMEBD APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build HOMEBD V2
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # JAVA 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ============================================================
      # GRADLE 8.9
      # ============================================================
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # ============================================================
      # ANDROID SDK
      # O RUNNER JÁ POSSUI O SDK
      # ============================================================
      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "ANDROID SDK"
          echo "========================================"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          if [ -d "$ANDROID_HOME" ]; then
            echo "✓ Android SDK encontrado"
          elif [ -d "$ANDROID_SDK_ROOT" ]; then
            echo "✓ Android SDK encontrado"
          else
            echo "✕ Android SDK não encontrado"
            exit 1
          fi

      # ============================================================
      # VERIFICAR PROJETO
      # ============================================================
      - name: Verify Android project
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "HOMEBD ANDROID PROJECT"
          echo "========================================"

          echo ""
          echo "Diretório:"
          pwd

          echo ""
          echo "Ficheiros:"
          find . -maxdepth 6 -type f | sort

          echo ""
          echo "========================================"
          echo "VERIFICAÇÃO"
          echo "========================================"

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

          echo "✓ settings.gradle.kts"
          echo "✓ build.gradle.kts"
          echo "✓ app/build.gradle.kts"
          echo "✓ AndroidManifest.xml"

          echo ""
          echo "✓ PROJETO ANDROID VALIDADO"

      # ============================================================
      # BUILD
      # ============================================================
      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "BUILD HOMEBD V2"
          echo "========================================"

          gradle \
            --no-daemon \
            --stacktrace \
            --info \
            assembleDebug

      # ============================================================
      # LOCALIZAR APK
      # ============================================================
      - name: Find APK
        shell: bash
        run: |
          echo "========================================"
          echo "APK GERADO"
          echo "========================================"

          find . \
            -type f \
            -name "*.apk" \
            -print

      # ============================================================
      # GUARDAR APK COMO ARTIFACT
      # ============================================================
      - name: Upload HOMEBD APK
        uses: actions/upload-artifact@v4
        with:
          name: HOMEBD-V2-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
