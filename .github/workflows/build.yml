name: Build HOMEBD

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build HOMEBD
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository
        run: |
          echo "=== REPOSITORY ==="
          pwd
          echo "--- Files ---"
          find . -maxdepth 3 -type f | sort

      # -------------------------------------------------
      # If HOMEBD is inside a ZIP, extract it
      # -------------------------------------------------

      - name: Extract HOMEBD ZIP if necessary
        shell: bash
        run: |
          if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then

            ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

            if [ -n "$ZIP_FILE" ]; then
              echo "ZIP encontrado: $ZIP_FILE"

              mkdir -p extracted
              unzip -o "$ZIP_FILE" -d extracted

              echo "Conteúdo extraído:"
              find extracted -maxdepth 4 -type f | sort

              SETTINGS=$(find extracted -type f \( \
                -name "settings.gradle.kts" -o \
                -name "settings.gradle" \
              \) | head -n 1)

              if [ -n "$SETTINGS" ]; then
                PROJECT_DIR=$(dirname "$SETTINGS")
                echo "Projeto encontrado em: $PROJECT_DIR"

                cp -R "$PROJECT_DIR"/. .
              else
                echo "ERRO: settings.gradle não encontrado no ZIP."
                exit 1
              fi
            else
              echo "ERRO: nenhum projeto Gradle ou ZIP encontrado."
              exit 1
            fi
          fi

      # -------------------------------------------------
      # Verify Gradle project
      # -------------------------------------------------

      - name: Verify HOMEBD project
        run: |
          echo "=== HOMEBD PROJECT ==="
          ls -la

          echo "--- Gradle files ---"
          find . -maxdepth 3 -type f \
            \( -name "*.gradle" \
            -o -name "*.gradle.kts" \
            -o -name "gradle-wrapper.properties" \) \
            -print

          test -f settings.gradle.kts || \
          test -f settings.gradle

      # -------------------------------------------------
      # Java
      # -------------------------------------------------

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # -------------------------------------------------
      # Android SDK
      # -------------------------------------------------

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # -------------------------------------------------
      # Install Gradle if wrapper is missing
      # -------------------------------------------------

      - name: Prepare Gradle
        shell: bash
        run: |
          if [ ! -f "./gradlew" ]; then

            echo "Gradle Wrapper não encontrado."
            echo "A instalar Gradle 8.9..."

            wget -q \
              https://services.gradle.org/distributions/gradle-8.9-bin.zip \
              -O /tmp/gradle.zip

            unzip -q /tmp/gradle.zip -d /opt

            export PATH="/opt/gradle-8.9/bin:$PATH"

            gradle --version

            gradle wrapper --gradle-version 8.9

          fi

          chmod +x ./gradlew

          echo "--- Gradle Wrapper ---"
          ls -la gradlew
          ls -la gradle/wrapper

      # -------------------------------------------------
      # Build
      # -------------------------------------------------

      - name: Build HOMEBD Debug APK
        run: |
          ./gradlew clean assembleDebug --stacktrace

      # -------------------------------------------------
      # Locate APK
      # -------------------------------------------------

      - name: Find APK
        run: |
          echo "=== APK GERADA ==="
          find . -type f -name "*.apk" -print

      # -------------------------------------------------
      # Upload APK
      # -------------------------------------------------

      - name: Upload HOMEBD APK
        uses: actions/upload-artifact@v4
        with:
          name: HOMEBD-debug
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
