name: Build HOMEBD APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build HOMEBD V2
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. DOWNLOAD DO PROJETO
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # 2. JAVA 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ============================================================
      # 3. ANDROID SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ============================================================
      # 4. GRADLE
      # ============================================================
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # ============================================================
      # 5. VERIFICAR PROJETO
      # ============================================================
      - name: Verify Android project
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "        HOMEBD ANDROID PROJECT"
          echo "========================================"

          echo ""
          echo "Diretório atual:"
          pwd

          echo ""
          echo "Ficheiros do projeto:"
          find . -maxdepth 6 -type f | sort

          echo ""
          echo "========================================"
          echo "        VERIFICAR GRADLE"
          echo "========================================"

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

          echo ""
          echo "✓ settings.gradle.kts encontrado"
          echo "✓ build.gradle.kts encontrado"
          echo "✓ app/build.gradle.kts encontrado"
          echo "✓ AndroidManifest.xml encontrado"

          echo ""
          echo "✓ PROJETO ANDROID VALIDADO"

      # ============================================================
      # 6. BUILD APK
      # ============================================================
      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "          BUILD HOMEBD V2"
          echo "========================================"

          gradle \
            --no-daemon \
            --stacktrace \
            --info \
            assembleDebug

      # ============================================================
      # 7. PROCURAR APK
      # ============================================================
      - name: Find generated APK
        shell: bash
        run: |
          echo "========================================"
          echo "             APK GERADO"
          echo "========================================"

          find . \
            -type f \
            -name "*.apk" \
            -print

      # ============================================================
      # 8. UPLOAD APK
      # ============================================================
      - name: Upload HOMEBD APK
        uses: actions/upload-artifact@v4
        with:
          name: HOMEBD-V2-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
