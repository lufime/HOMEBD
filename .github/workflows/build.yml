name: Build HOMEBD APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build HOMEBD V2
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # 2. JAVA 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ============================================================
      # 3. ANDROID SDK
      # ============================================================
      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "ANDROID SDK"
          echo "========================================"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          test -d "$ANDROID_HOME"

          echo "✓ Android SDK encontrado"

      # ============================================================
      # 4. ENCONTRAR ZIP DO HOMEBD
      # ============================================================
      - name: Find HOMEBD ZIP
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "PROCURAR PROJETO HOMEBD"
          echo "========================================"

          find . -maxdepth 2 -type f -name "*.zip" -print

          ZIP=$(find . -maxdepth 2 -type f -name "HOMEBD_V2_BUILD_FIXED.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "✕ HOMEBD_V2_BUILD_FIXED.zip não encontrado"
            exit 1
          fi

          echo "✓ ZIP encontrado:"
          echo "$ZIP"

          echo "HOMEBD_ZIP=$ZIP" >> "$GITHUB_ENV"

      # ============================================================
      # 5. EXTRAIR PROJETO
      # ============================================================
      - name: Extract HOMEBD project
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "EXTRAIR HOMEBD"
          echo "========================================"

          mkdir -p homebd_project

          unzip -o "$HOMEBD_ZIP" -d homebd_project

          echo ""
          echo "Conteúdo extraído:"
          find homebd_project -maxdepth 6 -type f | sort

      # ============================================================
      # 6. DETETAR RAIZ DO PROJETO
      # ============================================================
      - name: Locate Android project
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "LOCALIZAR PROJETO ANDROID"
          echo "========================================"

          SETTINGS=$(find homebd_project \
            -type f \
            -name "settings.gradle.kts" \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "✕ settings.gradle.kts não encontrado"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Projeto encontrado em:"
          echo "$PROJECT_DIR"

          echo "HOMEBD_PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # ============================================================
      # 7. VALIDAR PROJETO
      # ============================================================
      - name: Verify Android project
        shell: bash
        run: |
          set -e

          cd "$HOMEBD_PROJECT_DIR"

          echo "========================================"
          echo "VALIDAÇÃO HOMEBD"
          echo "========================================"

          pwd

          echo ""
          echo "Ficheiros:"
          find . -maxdepth 6 -type f | sort

          echo ""
          echo "Verificar ficheiros principais:"

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

          echo "✓ settings.gradle.kts"
          echo "✓ build.gradle.kts"
          echo "✓ app/build.gradle.kts"
          echo "✓ AndroidManifest.xml"

          echo ""
          echo "✓ PROJETO HOMEBD VALIDADO"

      # ============================================================
      # 8. VERIFICAR GRADLE
      # ============================================================
      - name: Show Gradle version
        shell: bash
        run: |
          gradle --version

      # ============================================================
      # 9. BUILD APK
      # ============================================================
      - name: Build HOMEBD Debug APK
        shell: bash
        run: |
          set -e

          cd "$HOMEBD_PROJECT_DIR"

          echo "========================================"
          echo "BUILD HOMEBD V2"
          echo "========================================"

          gradle \
            --no-daemon \
            --stacktrace \
            assembleDebug

      # ============================================================
      # 10. PROCURAR APK
      # ============================================================
      - name: Find generated APK
        shell: bash
        run: |
          echo "========================================"
          echo "APK GERADO"
          echo "========================================"

          find "$HOMEBD_PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

      # ============================================================
      # 11. UPLOAD APK
      # ============================================================
      - name: Upload HOMEBD APK
        uses: actions/upload-artifact@v4
        with:
          name: HOMEBD-V2-debug-apk
          path: |
            homebd_project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
