name: Build HOMEBD APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build HOMEBD
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # JAVA 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ============================================================
      # ANDROID SDK
      # ============================================================
      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "ANDROID SDK"
          echo "========================================"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          test -d "$ANDROID_HOME"

          echo "✓ Android SDK encontrado"

      # ============================================================
      # ENCONTRAR AUTOMATICAMENTE O ZIP HOMEBD
      # ============================================================
      - name: Find HOMEBD ZIP
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "PROCURAR ZIP HOMEBD"
          echo "========================================"

          find . -maxdepth 2 -type f -name "HOMEBD_*.zip" -print

          ZIP=$(find . -maxdepth 2 -type f \
            -name "HOMEBD_*.zip" \
            | sort -V \
            | tail -n 1)

          if [ -z "$ZIP" ]; then
            echo "✕ Nenhum ZIP HOMEBD encontrado"
            exit 1
          fi

          echo ""
          echo "✓ ZIP selecionado:"
          echo "$ZIP"

          echo "HOMEBD_ZIP=$ZIP" >> "$GITHUB_ENV"

      # ============================================================
      # EXTRAIR
      # ============================================================
      - name: Extract HOMEBD
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "EXTRAIR HOMEBD"
          echo "========================================"

          rm -rf homebd_project
          mkdir -p homebd_project

          unzip -o "$HOMEBD_ZIP" -d homebd_project

          echo ""
          echo "✓ Projeto extraído"

      # ============================================================
      # LOCALIZAR PROJETO ANDROID
      # ============================================================
      - name: Locate Android project
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "LOCALIZAR PROJETO ANDROID"
          echo "========================================"

          SETTINGS=$(find homebd_project \
            -type f \
            -name "settings.gradle.kts" \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "✕ settings.gradle.kts não encontrado"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "✓ Projeto encontrado:"
          echo "$PROJECT_DIR"

          echo "HOMEBD_PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # ============================================================
      # VALIDAR PROJETO
      # ============================================================
      - name: Verify Android project
        shell: bash
        run: |
          set -e

          cd "$HOMEBD_PROJECT_DIR"

          echo "========================================"
          echo "VALIDAR PROJETO HOMEBD"
          echo "========================================"

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

          echo "✓ settings.gradle.kts"
          echo "✓ build.gradle.kts"
          echo "✓ app/build.gradle.kts"
          echo "✓ AndroidManifest.xml"

          echo ""
          echo "✓ PROJETO VALIDADO"

      # ============================================================
      # GRADLE
      # ============================================================
      - name: Show Gradle
        shell: bash
        run: |
          gradle --version

      # ============================================================
      # BUILD
      # ============================================================
      - name: Build HOMEBD Debug APK
        shell: bash
        run: |
          set -e

          cd "$HOMEBD_PROJECT_DIR"

          echo "========================================"
          echo "BUILD HOMEBD"
          echo "========================================"

          gradle \
            --no-daemon \
            --stacktrace \
            assembleDebug

      # ============================================================
      # ENCONTRAR APK
      # ============================================================
      - name: Find generated APK
        shell: bash
        run: |
          echo "========================================"
          echo "APK GERADO"
          echo "========================================"

          find "$HOMEBD_PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

      # ============================================================
      # GUARDAR APK
      # ============================================================
      - name: Upload HOMEBD APK
        uses: actions/upload-artifact@v4
        with:
          name: HOMEBD-debug-apk
          path: |
            homebd_project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
